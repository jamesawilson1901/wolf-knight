      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07253d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mermaid" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Mermaid Reef</title>
    <style>
      :root {
        --sa-top: env(safe-area-inset-top, 0px);
        --sa-right: env(safe-area-inset-right, 0px);
        --sa-bottom: env(safe-area-inset-bottom, 0px);
        --sa-left: env(safe-area-inset-left, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07253d;
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        touch-action: none;
      }
      /* Portrait: full-screen rotate hint (image only, no text). Game pauses underneath. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        background: #07253d;
        z-index: 10;
        align-items: center;
        justify-content: center;
      }
      #rotate img {
        width: 42vmin;
        height: 42vmin;
        animation: wiggle 2.2s ease-in-out infinite;
      }
      @keyframes wiggle {
        0%,
        55%,
        100% {
          transform: rotate(0deg);
        }
        20%,
        35% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
    </style>

  <body>
    <div id="app"></div>
    <div id="rotate"><img src="./rotate.svg" alt="" /></div>
  </body>
</html>
