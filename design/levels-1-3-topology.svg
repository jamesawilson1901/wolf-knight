<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1320" viewBox="0 0 1180 1320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="1320" fill="#14110f"/>
  <text x="590" y="44" fill="#ffd9c2" font-size="27" font-weight="700" text-anchor="middle">Wolf Knight — Levels 1–3 Topology</text>
  <text x="590" y="70" fill="#9b8e85" font-size="14" text-anchor="middle">string of pearls → hub-and-spoke → loopback ring · thick line = the hidden spine (completable alone) · thin dashed = optional, always loops back</text>

  <!-- ═══════════ LEVEL 1 — STRING OF PEARLS ═══════════ -->
  <rect x="30" y="96" width="1120" height="356" rx="16" fill="#1b1613" stroke="#ff7a45" stroke-width="2"/>
  <text x="52" y="128" fill="#ff9d6a" font-size="19" font-weight="700">LEVEL 1 · EMBER HOLLOW</text>
  <text x="264" y="128" fill="#8c7f76" font-size="14">wide-linear "string of pearls" — 5 open islands, 4 chokepoints · target 4.3× area</text>
  <text x="52" y="150" fill="#6fe3a0" font-size="12">ability: FIRE WOLF (granted mid-level at the Forge Heart shrine) · puzzle room: The Order Hall</text>

  <!-- spine -->
  <line x1="120" y1="250" x2="1060" y2="250" stroke="#ff7a45" stroke-width="7"/>

  <!-- islands (big circles) + chokes (small squares) -->
  <g>
    <circle cx="140" cy="250" r="46" fill="#3b2a20" stroke="#ff7a45" stroke-width="3"/>
    <text x="140" y="245" fill="#ffd9c2" font-size="13" font-weight="700" text-anchor="middle">A</text>
    <text x="140" y="262" fill="#ffd9c2" font-size="11" text-anchor="middle">Ashfall</text>
    <text x="140" y="318" fill="#9b8e85" font-size="10" text-anchor="middle">ash grey</text>
    <text x="140" y="331" fill="#9b8e85" font-size="10" text-anchor="middle">▲ Fallen Gate</text>

    <rect x="242" y="232" width="36" height="36" rx="5" fill="#2b2320" stroke="#ff7a45" stroke-width="2"/>
    <text x="260" y="255" fill="#ffb38a" font-size="15" text-anchor="middle">⌷</text>

    <circle cx="380" cy="250" r="46" fill="#4a2a17" stroke="#ff7a45" stroke-width="3"/>
    <text x="380" y="245" fill="#ffd9c2" font-size="13" font-weight="700" text-anchor="middle">B</text>
    <text x="380" y="262" fill="#ffd9c2" font-size="11" text-anchor="middle">Causeway</text>
    <text x="380" y="318" fill="#9b8e85" font-size="10" text-anchor="middle">orange / black</text>
    <text x="380" y="331" fill="#9b8e85" font-size="10" text-anchor="middle">▲ the Kiln cone</text>

    <rect x="482" y="232" width="36" height="36" rx="5" fill="#2b2320" stroke="#ff7a45" stroke-width="2"/>
    <text x="500" y="255" fill="#ffb38a" font-size="15" text-anchor="middle">⌷</text>

    <circle cx="620" cy="250" r="46" fill="#5a1f18" stroke="#ff7a45" stroke-width="3"/>
    <text x="620" y="245" fill="#ffd9c2" font-size="13" font-weight="700" text-anchor="middle">C</text>
    <text x="620" y="262" fill="#ffd9c2" font-size="11" text-anchor="middle">Bridges</text>
    <text x="620" y="318" fill="#9b8e85" font-size="10" text-anchor="middle">deep red / lava</text>
    <text x="620" y="331" fill="#9b8e85" font-size="10" text-anchor="middle">▲ the Great Chain</text>

    <rect x="722" y="232" width="36" height="36" rx="5" fill="#2b2320" stroke="#ffd54a" stroke-width="2.5"/>
    <text x="740" y="256" fill="#ffd54a" font-size="14" text-anchor="middle">🔑</text>

    <circle cx="860" cy="250" r="46" fill="#6b4a12" stroke="#ffd54a" stroke-width="3"/>
    <text x="860" y="245" fill="#fff0cc" font-size="13" font-weight="700" text-anchor="middle">D</text>
    <text x="860" y="262" fill="#fff0cc" font-size="11" text-anchor="middle">the Kiln</text>
    <text x="860" y="318" fill="#9b8e85" font-size="10" text-anchor="middle">gold / amber</text>
    <text x="860" y="331" fill="#9b8e85" font-size="10" text-anchor="middle">▲ the Forge Heart</text>

    <rect x="962" y="232" width="36" height="36" rx="5" fill="#2b2320" stroke="#b33a5a" stroke-width="2"/>
    <text x="980" y="255" fill="#ff8fa3" font-size="15" text-anchor="middle">⌷</text>

    <circle cx="1080" cy="250" r="42" fill="#241a2e" stroke="#b33a5a" stroke-width="3"/>
    <text x="1080" y="245" fill="#e8d4ff" font-size="13" font-weight="700" text-anchor="middle">E</text>
    <text x="1080" y="262" fill="#e8d4ff" font-size="11" text-anchor="middle">Heart ◉</text>
    <text x="1080" y="318" fill="#9b8e85" font-size="10" text-anchor="middle">black / violet</text>
  </g>

  <!-- optional pockets, dashed, looping back -->
  <g stroke="#6b5c54" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M 118 208 C 100 170, 172 170, 158 208"/>
    <path d="M 358 208 C 336 164, 424 164, 402 208"/>
    <path d="M 598 208 C 576 164, 664 164, 642 208"/>
    <path d="M 838 208 C 816 164, 904 164, 882 208"/>
  </g>
  <g font-size="10" fill="#c9bdb4" text-anchor="middle">
    <text x="138" y="160">Ash Warrens</text>
    <text x="380" y="156">Moth Hollow 🐺 · Scorched Cubby 🐺(fire)</text>
    <text x="620" y="156">the Drowned Forge</text>
    <text x="860" y="156">THE ORDER HALL — puzzle room</text>
  </g>

  <!-- shortcut home -->
  <path d="M 1080 296 C 1080 400, 140 400, 140 300" fill="none" stroke="#ffd54a" stroke-width="2.5" stroke-dasharray="8 5"/>
  <polygon points="140,300 133,314 147,314" fill="#ffd54a"/>
  <text x="600" y="418" fill="#ffd54a" font-size="12" text-anchor="middle">shortcut home opens after the boss — a walked door, never a teleport</text>

  <!-- ═══════════ LEVEL 2 — HUB AND SPOKE ═══════════ -->
  <rect x="30" y="472" width="1120" height="386" rx="16" fill="#16180f" stroke="#b8c46a" stroke-width="2"/>
  <text x="52" y="504" fill="#cfdd80" font-size="19" font-weight="700">LEVEL 2 · STONEROOT CAVERNS</text>
  <text x="330" y="504" fill="#8c7f76" font-size="14">hub-and-spoke — the hub VISIBLY CHANGES on each of 3 returns · target 7.2× area</text>
  <text x="52" y="526" fill="#6fe3a0" font-size="12">ability: EARTH WOLF (Petra's Spark shrine, end of Spoke A) · puzzle room: The Rattle</text>

  <!-- hub -->
  <circle cx="330" cy="680" r="76" fill="#3a3d2a" stroke="#b8c46a" stroke-width="4"/>
  <text x="330" y="668" fill="#f2f7d8" font-size="14" font-weight="700" text-anchor="middle">THE GREAT</text>
  <text x="330" y="686" fill="#f2f7d8" font-size="14" font-weight="700" text-anchor="middle">VAULT</text>
  <text x="330" y="706" fill="#b8c46a" font-size="10" text-anchor="middle">▲ the Stone Titan</text>

  <!-- spokes -->
  <g stroke="#b8c46a" stroke-width="6" fill="none">
    <line x1="406" y1="640" x2="600" y2="580"/>
    <line x1="406" y1="680" x2="600" y2="680"/>
    <line x1="406" y1="720" x2="600" y2="780"/>
  </g>
  <g>
    <rect x="600" y="548" width="190" height="64" rx="10" fill="#22323a" stroke="#7fd8e8" stroke-width="2.5"/>
    <text x="695" y="572" fill="#d8f4fb" font-size="13" font-weight="700" text-anchor="middle">A · The Glimmerway</text>
    <text x="695" y="590" fill="#8fb6c2" font-size="10" text-anchor="middle">cyan · ▲ the Geode</text>
    <text x="695" y="604" fill="#6fe3a0" font-size="10" text-anchor="middle">→ EARTH WOLF</text>

    <rect x="600" y="648" width="190" height="64" rx="10" fill="#3a352a" stroke="#e0d3a8" stroke-width="2.5"/>
    <text x="695" y="672" fill="#f6efd8" font-size="13" font-weight="700" text-anchor="middle">B · The Bone Quarry</text>
    <text x="695" y="690" fill="#bdb08c" font-size="10" text-anchor="middle">bone white · ▲ the Ribcage</text>
    <text x="695" y="704" fill="#ffd54a" font-size="10" text-anchor="middle">→ THE RATTLE (puzzle)</text>

    <rect x="600" y="748" width="190" height="64" rx="10" fill="#1e3038" stroke="#6fb0c4" stroke-width="2.5"/>
    <text x="695" y="772" fill="#d6ecf5" font-size="13" font-weight="700" text-anchor="middle">C · The Sunken Stair</text>
    <text x="695" y="790" fill="#88a8b4" font-size="10" text-anchor="middle">blue-green · ▲ the Drowned Door</text>
    <text x="695" y="804" fill="#c9bdb4" font-size="10" text-anchor="middle">→ the Shoulder Pin</text>
  </g>

  <!-- hub-change returns -->
  <g stroke="#ffd54a" stroke-width="2.2" stroke-dasharray="7 4" fill="none">
    <path d="M 600 566 C 500 520, 380 540, 350 604"/>
    <path d="M 600 666 C 520 640, 470 650, 408 668"/>
    <path d="M 600 796 C 500 840, 380 820, 350 756"/>
  </g>
  <g font-size="11" fill="#ffd54a">
    <text x="404" y="556">change 1 — the lantern relights (the vault lights up)</text>
    <text x="430" y="636">change 2 — the water drains (a new floor)</text>
    <text x="404" y="856">change 3 — the titan's hand lowers into a ramp</text>
  </g>

  <!-- boss -->
  <line x1="330" y1="756" x2="330" y2="812" stroke="#b8c46a" stroke-width="6"/>
  <rect x="232" y="812" width="196" height="34" rx="8" fill="#241a1e" stroke="#b33a5a" stroke-width="2.5"/>
  <text x="330" y="835" fill="#ffd0da" font-size="13" font-weight="700" text-anchor="middle">◉ WARDEN'S CRYPT</text>

  <!-- entry -->
  <rect x="60" y="662" width="120" height="36" rx="8" fill="#1e3a2a" stroke="#6fe3a0" stroke-width="2"/>
  <text x="120" y="685" fill="#dff6e8" font-size="12" text-anchor="middle">from Ember</text>
  <line x1="180" y1="680" x2="254" y2="680" stroke="#b8c46a" stroke-width="6"/>

  <!-- optional pockets -->
  <g stroke="#6b5c54" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M 790 566 C 850 540, 872 596, 812 596"/>
    <path d="M 790 666 C 850 640, 872 696, 812 696"/>
    <path d="M 790 766 C 850 740, 872 796, 812 796"/>
  </g>
  <g font-size="10" fill="#c9bdb4">
    <text x="880" y="572">Glitter Pocket 🐺</text>
    <text x="880" y="672">side seam (chest)</text>
    <text x="880" y="772">Drowned Alcove</text>
  </g>

  <!-- ═══════════ LEVEL 3 — LOOPBACK RING ═══════════ -->
  <rect x="30" y="878" width="1120" height="412" rx="16" fill="#141a11" stroke="#8fdc6a" stroke-width="2"/>
  <text x="52" y="910" fill="#a8e888" font-size="19" font-weight="700">LEVEL 3 · WILD WOODS</text>
  <text x="256" y="910" fill="#8c7f76" font-size="14">loopback ring — shortcuts open from the FAR side · target 5.8× area</text>
  <text x="52" y="932" fill="#6fe3a0" font-size="12">ability: VERDANT WOLF (Sylva's Spark shrine, the Gloomwood) · puzzle room: The Knot</text>

  <!-- the ring -->
  <ellipse cx="470" cy="1108" rx="230" ry="132" fill="none" stroke="#8fdc6a" stroke-width="7"/>

  <g>
    <circle cx="470" cy="1240" r="44" fill="#3a3a18" stroke="#d8dc6a" stroke-width="3"/>
    <text x="470" y="1236" fill="#f4f6d0" font-size="12" font-weight="700" text-anchor="middle">1 THORNEDGE</text>
    <text x="470" y="1252" fill="#b4b884" font-size="10" text-anchor="middle">sick yellow</text>

    <circle cx="240" cy="1108" r="44" fill="#16282a" stroke="#5fa8a0" stroke-width="3"/>
    <text x="240" y="1104" fill="#d4eeec" font-size="12" font-weight="700" text-anchor="middle">2 GLOOMWOOD</text>
    <text x="240" y="1120" fill="#84aca8" font-size="10" text-anchor="middle">dark blue-green</text>

    <circle cx="470" cy="976" r="44" fill="#33261a" stroke="#c99a5c" stroke-width="3"/>
    <text x="470" y="972" fill="#f2e0c8" font-size="12" font-weight="700" text-anchor="middle">3 ROOTBOUND</text>
    <text x="470" y="988" fill="#bda184" font-size="10" text-anchor="middle">brown / amber</text>

    <circle cx="700" cy="1108" r="44" fill="#3a2430" stroke="#f0a8c8" stroke-width="3"/>
    <text x="700" y="1104" fill="#ffe0ee" font-size="12" font-weight="700" text-anchor="middle">4 BLOOMFALL</text>
    <text x="700" y="1120" fill="#c896ac" font-size="10" text-anchor="middle">pink — already well</text>
  </g>

  <!-- glade in the middle, entered from Bloomfall -->
  <circle cx="470" cy="1108" r="50" fill="#1c3a1c" stroke="#8fdc6a" stroke-width="3"/>
  <text x="470" y="1104" fill="#dfffcc" font-size="12" font-weight="700" text-anchor="middle">◉ SYLVA'S</text>
  <text x="470" y="1120" fill="#dfffcc" font-size="12" font-weight="700" text-anchor="middle">GLADE</text>
  <line x1="656" y1="1108" x2="520" y2="1108" stroke="#8fdc6a" stroke-width="5" stroke-dasharray="none"/>

  <!-- direction of travel -->
  <polygon points="352,1216 340,1200 362,1198" fill="#8fdc6a"/>
  <polygon points="352,1000 366,1014 344,1018" fill="#8fdc6a"/>
  <text x="300" y="1188" fill="#8fdc6a" font-size="11">travel →</text>

  <!-- shortcuts, opening from the far side -->
  <path d="M 700 1152 C 660 1236, 560 1268, 514 1252" fill="none" stroke="#ffd54a" stroke-width="2.5" stroke-dasharray="8 5"/>
  <polygon points="514,1252 526,1244 524,1258" fill="#ffd54a"/>
  <text x="742" y="1206" fill="#ffd54a" font-size="11">SHORTCUT — push a log over</text>
  <text x="742" y="1222" fill="#ffd54a" font-size="11">(opens from the far side)</text>

  <path d="M 428 976 C 340 990, 268 1030, 254 1066" fill="none" stroke="#ffd54a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="286" y="964" fill="#ffd54a" font-size="11">2nd shortcut — cut the root-wall</text>

  <!-- optional pockets -->
  <g stroke="#5c6b54" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M 470 1284 C 540 1300, 566 1256, 512 1252"/>
    <path d="M 196 1108 C 130 1090, 118 1146, 176 1140"/>
    <path d="M 470 932 C 540 916, 566 960, 512 964"/>
    <path d="M 744 1108 C 810 1090, 822 1146, 764 1140"/>
  </g>
  <g font-size="10" fill="#bdc9b4">
    <text x="556" y="1296">Hollow Oak 🐺</text>
    <text x="46" y="1160">Wisp Pocket</text>
    <text x="556" y="928">Under-root 🐺</text>
    <text x="838" y="1160">Petal Hollow</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#d8ccc3">
    <line x1="880" y1="960" x2="1130" y2="960" stroke="#3a302c" stroke-width="1"/>
    <text x="880" y="984" fill="#9b8e85" font-size="12" font-weight="700">LEGEND</text>
    <line x1="884" y1="1002" x2="916" y2="1002" stroke="#8fdc6a" stroke-width="6"/>
    <text x="926" y="1006">the hidden spine</text>
    <line x1="884" y1="1026" x2="916" y2="1026" stroke="#6b5c54" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="926" y="1030">optional — loops back</text>
    <line x1="884" y1="1050" x2="916" y2="1050" stroke="#ffd54a" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="926" y="1054">shortcut (walked, never a teleport)</text>
    <text x="884" y="1080">▲</text><text x="926" y="1080">hero prop — the memory anchor</text>
    <text x="884" y="1104">🐺</text><text x="926" y="1104">lost pup (3 per level)</text>
    <text x="884" y="1128">⌷</text><text x="926" y="1128">chokepoint — compression before release</text>
    <text x="884" y="1156" fill="#9b8e85" font-size="11">Every level: 12 Sparks mark the spine.</text>
    <text x="884" y="1174" fill="#9b8e85" font-size="11">Every level: one ability, one puzzle room.</text>
    <text x="884" y="1192" fill="#9b8e85" font-size="11">No dead ends. No unwinnable states.</text>
  </g>
</svg>
