name: verify

# quick: every push, any branch — this is also how a branch PROVES the
# workflow itself works before merge, since the schedule/dispatch triggers
# below only fire from main (docs/TESTING.md §8).
#
# sweep: the full suite, sharded across 8 runners, nightly + on demand. Each
# shard is its own VM running its suites serially, so the --par false-failure
# class (CPU contention between suites sharing one box) cannot occur here by
# construction.
on:
  push:
  schedule:
    # 14:00 UTC ≈ midnight Brisbane (docs/TESTING.md §8).
    - cron: '0 14 * * *'
  workflow_dispatch: {}

# ONE RUN PER BRANCH. Pushing three times in five minutes used to start three
# full quick jobs that all raced to the same verdict on stale commits. The
# newest push is the only one whose answer matters, so older in-flight runs on
# the same ref are cancelled.
#
# Read a `cancelled` status carefully because of this: from 2026-09-05 it means
# SUPERSEDED BY A NEWER PUSH. Before that date it meant the 20-minute quick-job
# limit killed the run, which happened thirty-eight times in a row and is the
# reason this file was revisited at all. Nightly sweeps are never cancelled
# this way — they run on their own schedule against main.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick
    runs-on: ubuntu-latest
    # The quick set measures ~3 minutes (tools/verify-all.sh --quick lists the
    # per-suite numbers). Twelve is four times that, which is enough headroom
    # for one automatic serial re-run and still fails FAST if something hangs.
    # It used to be 20, and 20 was not generous — it was exactly long enough
    # for a slow known-fail plus its retry to eat the whole budget and be
    # killed with nothing reported.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      - name: Install test tooling (pinned Playwright)
        working-directory: tools
        run: npm ci

      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Start the static server
        run: |
          node tools/serve.mjs > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8901/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "server never came up:"; cat /tmp/serve.log; exit 1

      # One second, no browser, no server, and it runs BEFORE the suites so a
      # typo or a stale name fails in seconds instead of three minutes.
      # Exit status follows no-undef only; unused-variable findings print as
      # warnings (tools/eslint.config.mjs explains why, and the board item
      # that turns them into errors).
      - name: lint (no-undef)
        run: sh tools/lint.sh

      - name: verify-all.sh --quick
        run: sh tools/verify-all.sh --quick

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-evidence
          path: |
            /tmp/vall-*.log
            /tmp/serve.log
          retention-days: 5
          if-no-files-found: ignore

  sweep:
    name: sweep (shard ${{ matrix.shard }}/8)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Shard 7 measured 58m25s against a 60-minute limit on 2026-09-03 and was
    # killed; shard 6 was killed the same night. Both were cancellations, which
    # report as neither pass nor fail, so two nights of sweep results said
    # nothing at all. The shards are cost-balanced now (see `heavy_first` in
    # tools/verify-all.sh), and the limit has room to be wrong in.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      - name: Install test tooling (pinned Playwright)
        working-directory: tools
        run: npm ci

      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Start the static server
        run: |
          node tools/serve.mjs > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8901/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "server never came up:"; cat /tmp/serve.log; exit 1

      - name: verify-all.sh --shard ${{ matrix.shard }}/8
        id: sweep
        run: |
          sh tools/verify-all.sh --shard ${{ matrix.shard }}/8 | tee /tmp/sweep-shard-${{ matrix.shard }}.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Job summary — timing table
        if: always()
        run: |
          {
            echo "### Shard ${{ matrix.shard }}/8"
            echo '```'
            awk '/^timing \(slowest first\):$/{f=1;next} /^$/{f=0} f' /tmp/sweep-shard-${{ matrix.shard }}.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-shard-${{ matrix.shard }}-evidence
          path: |
            /tmp/vall-*.log
            /tmp/sweep-shard-${{ matrix.shard }}.log
            /tmp/serve.log
          retention-days: 5
          if-no-files-found: ignore
